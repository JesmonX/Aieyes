<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aieyes · Desktop Preview</title><link rel="stylesheet" href="/preview/workbench.css"><script defer src="/preview/model.js"></script><script defer src="/preview/workbench.js"></script></head>
<body>
  <header class="topbar"><div class="identity"><img src="/app/brand.png" alt=""><div><strong>Aieyes <span>Preview</span></strong><small>Windows / Linux 调试工作台</small></div></div><div class="platforms" role="group" aria-label="预览平台"><button data-platform="windows" aria-pressed="true">Windows</button><button data-platform="linux" aria-pressed="false">Linux</button></div><span class="local-badge"><i></i> 本地模拟数据</span><button id="reload" type="button">重新加载</button></header>
  <main>
    <section class="controls" aria-label="预览控制">
      <div class="control-row"><div class="surfaces" role="group" aria-label="预览窗口"><button data-surface="main" aria-pressed="true">主窗口</button><button data-surface="panel" aria-pressed="false">悬浮面板</button></div><label>数据场景<select id="scenario"><option value="workspace">正常工作区</option><option value="empty">空数据 / 首次配置</option><option value="single">单账户</option><option value="multi">多账户</option><option value="long">长名称 / 大数值</option><option value="failure">连接失败</option><option value="capacity">大量数据</option></select></label><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></label><label>语言<select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><button id="reset" class="subtle" type="button">重置当前场景</button></div>
      <div class="control-row secondary"><label>尺寸<select id="size"><option value="default">默认窗口</option><option value="minimum">最小窗口 · 640 × 440</option><option value="wide">宽窗口 · 1440 × 900</option><option value="custom">自定义</option></select></label><label class="dimension">宽<input id="width" type="number" min="320" max="3840" value="1294" aria-label="预览宽度"></label><span class="times">×</span><label class="dimension">高<input id="height" type="number" min="240" max="2160" value="840" aria-label="预览高度"></label><label>画布<select id="zoom"><option value="fit">适应画布</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select></label><span class="separator"></span><label>请求延迟<select id="delay"><option value="0">无</option><option value="500">500 ms</option><option value="2000">2 s</option></select></label><label>故障注入<select id="failure"><option value="none">关闭</option><option value="query">查询失败</option><option value="save">保存失败</option></select></label></div>
    </section>
    <div class="notice" id="boundary">加载预览…</div><p class="status" id="status" role="status">正在生成模拟数据…</p>
    <section id="stage" aria-label="应用预览"><div id="scaled"><div id="window"><div id="linux-title" hidden><span>● &nbsp; Aieyes</span><span>− &nbsp; □ &nbsp; ×</span></div><iframe id="app" title="Aieyes 应用预览" src="about:blank"></iframe></div></div><div id="closed" hidden><strong>预览窗口已收起</strong><p>模拟窗口操作不会关闭浏览器或正在运行的应用。</p><button id="restore" type="button">恢复预览</button></div></section>
    <details id="logs"><summary>调用与错误 <span id="log-count">0</span><span id="error-count"></span></summary><div class="log-tools"><span>IPC 调用、模拟结果与页面异常 · 最多保留 200 条</span><button id="clear-logs" type="button">清空日志</button><button id="copy-logs" type="button">复制日志</button></div><div id="log-list" role="log" aria-label="调试日志"></div></details>
    <footer><span id="viewport-label">—</span><span>直接加载应用源码 · 修改代码自动重载 · 已保存的模拟配置保留</span></footer>
  </main>
  <dialog id="reset-dialog"><h2>重置当前场景？</h2><p>清除当前平台和场景的模拟修改及界面偏好，恢复初始合成数据。</p><div><button id="cancel-reset">取消</button><button id="confirm-reset">重置场景</button></div></dialog>
  <dialog id="path-dialog"><h2>模拟文件选择</h2><p>填写用于界面调试的路径；不会读取或检查实际文件。</p><form id="path-form"><label>模拟路径<input id="mock-path" autocomplete="off"></label><div><button type="button" id="cancel-path">取消</button><button type="submit">选择</button></div></form></dialog>
</body></html>
