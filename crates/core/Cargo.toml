[package]
name = "aieyes-core"
version = "0.1.50"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
toml = "1.1.4"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
walkdir = "2.5.0"
notify = "8.2.0"
libc = "0.2.189"
keyring = "4.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "linux-tmpfs", "linux-netdevs"] }
portable-pty = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
shell-words = "1.1.1"
dunce = "1.0.5"
zstd = "0.13"
serde_yaml_ng = "0.10"
unsafe-libyaml = "0.2.11"
tempfile = "3.27.0"

[dev-dependencies]
keyring-core = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
