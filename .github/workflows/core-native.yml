name: Core and macOS regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - name: Localization catalogs and source coverage
        run: |
          python scripts/sync-localizations.py --check
          python scripts/check-localizations.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Windows CLI stdin forwarding regression
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for attempt in {1..5}; do
            cargo test -p aieyes-core --lib --locked initialization_preserves_home_paths_environment_arguments_and_stdin -- --nocapture
          done
      - run: cargo test --workspace --locked
      - name: Build macOS client and verify native contracts
        if: runner.os == 'macOS'
        run: |
          swift build --package-path apps/macos --scratch-path .build/swift --disable-sandbox
          sh scripts/test-native.sh
