name: Core and macOS regression tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Same-repository PR commits are already tested by their branch push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - name: Localization catalogs and source coverage
        run: |
          python scripts/sync-localizations.py --check
          python scripts/check-localizations.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Windows CLI stdin forwarding regression
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for attempt in {1..5}; do
            cargo test -p aieyes-core --lib --locked initialization_preserves_home_paths_environment_arguments_and_stdin -- --nocapture
          done
      - name: Linux process identification regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for attempt in {1..10}; do
            cargo test -p aieyes-core --lib --locked native_profile_switch_preserves_api_fixture_and_closes_login_fixture
          done
      - run: cargo test --workspace --locked
      # Native contracts are architecture-neutral; Intel still builds and verifies its own release DMG.
      - name: Build macOS client and verify native contracts
        if: matrix.os == 'macos-15'
        run: sh scripts/test-native.sh
