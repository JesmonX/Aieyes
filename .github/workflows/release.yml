name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, e.g. v0.1.0'
        required: true
        type: string
      publish:
        description: 'Publish after all builds succeed (off = build validation only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and versions
        run: |
          python scripts/release.py check --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/test-release.py
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libglib2.0-bin
      - name: Shared checks
        shell: bash
        run: |
          python scripts/release.py check --tag "$RELEASE_TAG"
          cargo test --workspace --locked
          python scripts/test-collectors.py
          node --check apps/desktop/web/app.js
          node --check apps/desktop/web/tooltip.js
          node --check apps/desktop/web/multiselect.js
          node --check apps/desktop/web/desktop.js
          node --check apps/desktop/web/floating.js
          node --test scripts/test-desktop.mjs scripts/test-multiselect.mjs scripts/test-release-publish.mjs
      - name: Desktop Rust tests
        if: runner.os != 'macOS'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features custom-protocol
      - name: Browser integration
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix apps/desktop
          cd apps/desktop
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Install Tauri CLI
        if: runner.os != 'macOS'
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: macOS DMG and native checks
        if: runner.os == 'macOS'
        run: |
          sh scripts/build-macos.sh release --dmg
          sh scripts/test-native.sh
          codesign --verify --deep --strict dist/Aieyes.app
          EXPECTED_ARCH=$(uname -m)
          test "$(lipo -archs dist/Aieyes.app/Contents/MacOS/Aieyes)" = "$EXPECTED_ARCH"
          test "$(lipo -archs dist/Aieyes.app/Contents/Resources/aieyes-core)" = "$EXPECTED_ARCH"
          hdiutil verify dist/*.dmg
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop.ps1 release
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sh scripts/build-desktop.sh release
      - name: Collect packages
        shell: bash
        run: python scripts/release.py collect --tag "$RELEASE_TAG" --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - run: python scripts/release.py checksums --tag "$RELEASE_TAG"
      - name: Upload complete draft and publish
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/publish-release.cjs')({github, context});
