name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, e.g. v0.1.0'
        required: true
        type: string
      publish:
        description: 'Publish after all builds succeed (off = build validation only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and versions
        run: |
          python scripts/release.py check --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/test-release.py
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AIEYES_REQUIRE_UPDATER: '1'
      AIEYES_UPDATER_PUBLIC_KEY: ${{ vars.AIEYES_UPDATER_PUBLIC_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libglib2.0-bin
      - name: Validate update signing configuration
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            test -n "$SPARKLE_PUBLIC_KEY" || { echo 'Configure SPARKLE_PUBLIC_KEY repository variable'; exit 1; }
          else
            test -n "$AIEYES_UPDATER_PUBLIC_KEY" || { echo 'Configure AIEYES_UPDATER_PUBLIC_KEY repository variable'; exit 1; }
          fi
          mkdir -p dist
          if [ -f "docs/release-notes/$RELEASE_TAG.md" ]; then
            cp "docs/release-notes/$RELEASE_TAG.md" dist/release-notes.txt
          else
            git log -15 --pretty=format:'%s' > dist/release-notes.txt
          fi
      - name: Shared checks
        shell: bash
        run: |
          python scripts/release.py check --tag "$RELEASE_TAG"
          cargo test --workspace --locked
          python scripts/test-collectors.py
          python scripts/test-wakeups.py
          node --check apps/desktop/web/app.js
          node --check apps/desktop/web/tooltip.js
          node --check apps/desktop/web/multiselect.js
          node --check apps/desktop/web/desktop.js
          node --check apps/desktop/web/floating.js
          node --check apps/desktop/web/sessions.js
          node --check apps/desktop/web/updates.js
          node --check apps/desktop/web/wakeups.js
          node --test scripts/test-desktop.mjs scripts/test-multiselect.mjs scripts/test-release-publish.mjs
      - name: Linux process identification regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for attempt in {1..10}; do
            cargo test -p aieyes-core --lib --locked native_profile_switch_preserves_api_fixture_and_closes_login_fixture
          done
      - name: Desktop Rust tests
        if: runner.os != 'macOS'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features custom-protocol
      - name: Browser integration
        if: runner.os != 'macOS'
        run: |
          npm ci --prefix apps/desktop
          cd apps/desktop
          npx playwright install --with-deps chromium
          npm run test:ui
          node ../../scripts/test-windows-ui.cjs
      - name: Install Tauri CLI
        if: runner.os != 'macOS'
        run: npm install --global @tauri-apps/cli@2.12.1
      - name: Update signature tampering tests
        if: runner.os != 'macOS'
        run: python scripts/test-update-signatures.py
      - name: Optional Developer ID signing setup
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python3 scripts/setup-macos-signing.py
      - name: macOS DMG and native checks
        if: runner.os == 'macOS'
        run: |
          sh scripts/build-macos.sh release --dmg
          sh scripts/test-native.sh
          codesign --verify --deep --strict dist/Aieyes.app
          EXPECTED_ARCH=$(uname -m)
          test "$(lipo -archs dist/Aieyes.app/Contents/MacOS/Aieyes)" = "$EXPECTED_ARCH"
          test "$(lipo -archs dist/Aieyes.app/Contents/Resources/aieyes-core)" = "$EXPECTED_ARCH"
          hdiutil verify dist/*.dmg
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop.ps1 release
      - name: Windows native panel interaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-panel.ps1
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-ui-evidence
          path: .local/windows-ui-sync/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sh scripts/build-desktop.sh release
      - name: Collect packages
        shell: bash
        run: python scripts/release.py collect --tag "$RELEASE_TAG" --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - name: Sign macOS updates and feeds
        if: runner.os == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sh scripts/prepare-sparkle.sh
          python3 scripts/sign-macos-update.py --arch '${{ matrix.arch }}'
      - name: Sign Windows and Linux updates
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/sign-desktop-updates.py --platform '${{ matrix.platform }}'
      - name: Clean temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: python3 scripts/setup-macos-signing.py --cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
  publish:
    env:
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - run: |
          mkdir -p dist
          if [ -f "docs/release-notes/$RELEASE_TAG.md" ]; then
            cp "docs/release-notes/$RELEASE_TAG.md" dist/release-notes.txt
          else
            git log -15 --pretty=format:'%s' > dist/release-notes.txt
          fi
          python scripts/release.py updates --tag "$RELEASE_TAG"
          python scripts/release.py checksums --tag "$RELEASE_TAG"
      - name: Upload complete draft and publish
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/publish-release.cjs')({github, context});
