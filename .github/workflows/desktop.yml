name: Windows and Linux desktop
on:
  workflow_dispatch:
    inputs:
      full_checks:
        description: '额外运行核心全量测试（默认已运行共享、浏览器与 Tauri 检查和打包）'
        type: boolean
        default: false
  push:
    branches: [main, 'feat/**']
    paths: ['apps/desktop/**', 'crates/core/**', 'scripts/**', 'docs/core-contracts.json', 'docs/ui-phase-colors.json', 'docs/chart-palettes.json', 'Cargo.*', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'crates/core/**', 'scripts/**', 'docs/core-contracts.json', 'docs/ui-phase-colors.json', 'docs/chart-palettes.json', 'Cargo.*', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libglib2.0-bin rpm
      - name: Shared checks
        shell: bash
        run: sh scripts/ci-checks.sh
      - name: Browser integration
        shell: bash
        run: |
          node scripts/prepare-wakeup.cjs --debug
          npm ci --prefix apps/desktop
          cd apps/desktop
          npx playwright install --with-deps chromium
          npm run test:ui
          node ../../scripts/test-windows-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-previews-${{ runner.os }}
          path: |
            .local/ui-previews/*.png
            .local/pets/*.png
            .local/windows-ui-sync/browser/*
            .local/windows-ui-sync/interactions/*.png
            .local/ui-redesign-*/web/*.png
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Windows account switching tests
        if: runner.os == 'Windows'
        run: cargo test -p aieyes-core codex_auth --locked
      - name: Desktop shell tests
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked --features custom-protocol -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features custom-protocol
      - name: Optional Rust tests
        if: inputs.full_checks == true
        shell: bash
        run: |
          cargo test --workspace --locked
      - name: Install prebuilt Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.1
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop.ps1 release
      - name: Windows native panel interaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-panel.ps1
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-ui-evidence
          path: .local/windows-ui-sync/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sh scripts/build-desktop.sh release
          python3 scripts/check-linux-package-size.py
      - uses: actions/upload-artifact@v4
        with:
          name: Aieyes-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
