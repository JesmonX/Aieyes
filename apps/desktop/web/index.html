<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aieyes</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="windows.css"><script src="contracts.js"></script><script src="chart-palettes.js"></script><script src="i18n-catalog.js"></script><script src="i18n.js"></script><script src="theme.js"></script><link rel="stylesheet" href="workspace.css"></head>
<body>
<div id="titlebar" hidden><div class="titlebar-drag" data-tauri-drag-region="deep"><span class="titlebar-mark"><img class="brand-art" src="brand.png" alt="Aieyes"></span><span class="titlebar-title">Aieyes</span></div><div class="window-controls"><button id="window-minimize" tabindex="-1" aria-label="最小化" title="最小化"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><button id="window-maximize" tabindex="-1" aria-label="最大化" title="最大化"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button><button id="window-close" tabindex="-1" aria-label="关闭窗口，继续后台监测" title="关闭窗口，继续后台监测"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button></div></div>
<div class="shell">
  <aside>
    <div class="brand"><button type="button" id="sidebar-toggle" class="eye" aria-label="收起导航" aria-expanded="true"><img class="brand-art" src="brand.png" alt=""></button><div>Aieyes</div></div>
    <nav aria-label="主导航">
      <div class="nav-group-label">监测</div>
      <button data-page="agent" title="总览"><span data-ui-icon="overview" aria-hidden="true"></span><span>总览</span></button>
      <button data-page="analysis" title="用量分析"><span data-ui-icon="trend" aria-hidden="true"></span><span>用量分析</span></button>
      <button data-page="servers" title="服务器"><span data-ui-icon="hosts" aria-hidden="true"></span><span>服务器</span></button>
      <div class="nav-group-label">配置</div>
      <button data-settings-tab="integrations" title="接入与账户"><span data-ui-icon="account" aria-hidden="true"></span><span>接入与账户</span></button>
      <button data-settings-tab="hosts" title="机器与采集"><span data-ui-icon="computer" aria-hidden="true"></span><span>机器与采集</span></button>
      <button data-settings-tab="prices" title="模型价格"><span data-ui-icon="prices" aria-hidden="true"></span><span>模型价格</span></button>
      <button data-settings-tab="wakeups" title="定时唤醒"><span data-ui-icon="wakeups" aria-hidden="true"></span><span>定时唤醒</span></button>
    </nav>
    <div class="workspace-utilities">
      <nav aria-label="偏好"><button data-page="settings" data-settings-tab="general" title="设置"><span data-ui-icon="settings" aria-hidden="true"></span><span>设置</span></button></nav>
      <details class="workspace-help" data-menu><summary aria-label="帮助" title="帮助"><span data-ui-icon="info" aria-hidden="true"></span><span>帮助</span></summary><div class="workspace-help-menu"><button type="button" data-guide-open>配置向导</button></div></details>
    </div>
    <div class="aside-foot"><span class="dot"></span><span id="activity">正在加载</span><small id="app-version"></small></div>
  </aside>
  <main>
    <header><h1 id="title">总览</h1><div class="header-actions"><details class="theme-menu" data-menu data-theme-menu><summary aria-label="主题" title="主题"></summary><div class="theme-menu-body"><button type="button" role="menuitemradio" data-theme-choice="system">跟随系统</button><button type="button" role="menuitemradio" data-theme-choice="light">浅色</button><button type="button" role="menuitemradio" data-theme-choice="dark">深色</button></div></details><div class="refresh-wrap"><button id="refresh" aria-haspopup="true" aria-expanded="false" aria-controls="refresh-menu" title="刷新">刷新</button><div id="refresh-menu" class="refresh-menu" role="menu" hidden><button id="scan" role="menuitem" data-refresh="scan">同步记录</button><button id="quota" role="menuitem" data-refresh="quotas">刷新额度</button><button role="menuitem" data-refresh="prices">同步价格</button><button role="menuitem" data-refresh="hosts">刷新服务器</button></div></div></div></header>
    <div id="message" role="status" hidden></div>
    <details id="live-sessions"><summary><span id="session-indicator" class="phase-mark session-phase" aria-hidden="true"></span><span id="session-summary">正在读取会话状态…</span></summary><div id="session-list"></div><div id="session-warning" class="error" hidden>部分日志不可读，状态可能不完整。</div></details>
    <section id="content"></section>
  </main>
</div>
<div id="editor-backdrop" hidden></div>
<dialog id="editor" aria-labelledby="editor-title" aria-describedby="editor-error"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="关闭" title="关闭" data-ui-icon="x"></button></div><div id="editor-error" class="error" role="alert" hidden></div><div id="editor-fields"></div><div class="dialog-foot"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<script src="icons.js"></script><script src="scroll-affordance.js"></script><script src="webview-guards.js"></script><script src="tooltip.js"></script><script src="menu.js"></script><script src="motion.js"></script><script src="single-select.js"></script><script src="multiselect.js"></script><script src="sessions.js"></script><script src="refresh.js"></script><script src="ui-state.js"></script><script src="balanced-grid.js"></script><script src="pet-animation.js"></script><script src="analysis.js"></script><script src="server-renderer.js"></script><script src="account-targets.js"></script><script src="view-state.js"></script><script src="app.js"></script><script src="quota-card-layout.js"></script><script src="pet-library.js"></script><script src="desktop.js"></script><script src="network.js"></script><script src="updates.js"></script><script src="notifications.js"></script><script src="wakeups.js"></script><script src="codex-auth.js"></script><script src="automatic-estimates.js"></script><script src="codex-api.js"></script><script src="agent-settings.js"></script><script src="account-scan.js"></script><script src="ssh-config.js"></script><script src="setup-guide.js"></script>
</body></html>
