    <nav aria-label="主导航"><div class="nav-group-label">监测</div><button data-page="agent" title="Agent 总览"><span data-ui-icon="sources" aria-hidden="true"></span><span>Agent 总览</span></button><button data-page="analysis" title="用量分析"><span data-ui-icon="trend" aria-hidden="true"></span><span>用量分析</span></button><button data-page="servers" title="服务器"><span data-ui-icon="hosts" aria-hidden="true"></span><span>服务器</span></button><div class="nav-group-label">配置</div><button type="button" data-guide-open title="配置向导"><span data-ui-icon="checked" aria-hidden="true"></span><span>配置向导</span></button><button data-settings-tab="integrations" data-page="settings" title="接入与账户"><span data-ui-icon="sources" aria-hidden="true"></span><span>接入与账户</span></button><button data-settings-tab="hosts" title="机器与采集"><span data-ui-icon="hosts" aria-hidden="true"></span><span>机器与采集</span></button><button data-settings-tab="prices" title="模型价格"><span data-ui-icon="prices" aria-hidden="true"></span><span>模型价格</span></button><button data-settings-tab="wakeups" title="定时唤醒"><span data-ui-icon="wakeups" aria-hidden="true"></span><span>定时唤醒</span></button><div class="nav-group-label">偏好</div><button data-general-page="appearance" data-settings-tab="general" title="外观"><span data-ui-icon="sun" aria-hidden="true"></span><span>外观</span></button><button data-general-page="desktop" title="桌宠与会话"><span data-ui-icon="pet" aria-hidden="true"></span><span>桌宠与会话</span></button><button data-general-page="network" title="网络代理"><span data-ui-icon="network" aria-hidden="true"></span><span>网络代理</span></button><button data-general-page="refresh" title="刷新与历史"><span data-ui-icon="refresh" aria-hidden="true"></span><span>刷新与历史</span></button><button data-general-page="notifications" title="通知"><span data-ui-icon="info" aria-hidden="true"></span><span>通知</span></button><button data-general-page="updates" title="更新与关于"><span data-ui-icon="info" aria-hidden="true"></span><span>更新与关于</span></button></nav>

  <main>
    <header><h1 id="title">Agent 总览</h1><div class="header-actions"><button type="button" data-language-toggle translate="no" aria-label="切换到英文" title="切换到英文">English</button><button type="button" data-theme-toggle aria-label="切换明暗模式" title="切换明暗模式"></button><div class="refresh-wrap"><button id="refresh" aria-haspopup="true" aria-expanded="false" aria-controls="refresh-menu" title="刷新">刷新</button><div id="refresh-menu" class="refresh-menu" role="menu" hidden><button id="scan" role="menuitem" data-refresh="scan">同步记录</button><button id="quota" role="menuitem" data-refresh="quotas">刷新额度</button><button role="menuitem" data-refresh="prices">同步价格</button><button role="menuitem" data-refresh="hosts">刷新服务器</button></div></div></div></header>
