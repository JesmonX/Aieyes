<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aieyes</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell">
<aside><div class="brand"><span class="eye">◉</span><div>Aieyes<small>Agent 与服务器</small></div></div><nav><button class="active" data-page="agent">◈ <span>Agent 概览</span></button><button data-page="servers">▤ <span>服务器</span></button><button data-page="settings">⚙ <span>设置</span></button></nav><div class="aside-foot"><span class="dot"></span><span id="activity">正在加载</span><small>0.1.0</small></div></aside>
<main><header><div><p class="eyebrow">AIEYES / ACTIVITY</p><h1 id="title">Agent 概览</h1></div><div class="actions"><button id="scan">同步记录</button><button id="quota">刷新限额</button></div></header><div id="message" role="status" hidden></div><details id="live-sessions"><summary><span class="dot"></span> <span id="session-summary">正在读取会话状态…</span><span class="muted">本机 Codex</span></summary><div id="session-list"></div><p id="session-warning" class="error" hidden>部分日志不可读，状态可能不完整。</p><p class="muted tiny">仅读取已启用的本机 Codex 日志。3 分钟无更新标记为待确认；日志状态不代表进程存活。</p></details><section id="content"></section></main>
</div><dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields"></div><div class="dialog-foot"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><script src="app.js"></script><script src="desktop.js"></script></body></html>
