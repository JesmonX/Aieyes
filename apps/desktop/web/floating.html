<!doctype html>
<html lang="zh-CN" data-surface="panel">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aieyes 会话状态</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="floating.css"><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="windows.css"><script src="contracts.js"></script><script src="chart-palettes.js"></script><script src="theme.js"></script><link rel="stylesheet" href="workspace.css"></head>
<body data-view="ball">
  <button id="ball" type="button" aria-label="打开 Aieyes 面板；拖动可移动，右键打开菜单" title="单击打开面板 · 拖动移动 · 右键菜单">
    <canvas id="pet-sprite" width="132" height="143" aria-hidden="true"></canvas>
    <span id="phase" aria-live="polite">连接中</span><span id="count" hidden></span>
  </button>
  <div id="panel">
    <header class="panel-head">
      <span class="panel-mark" aria-hidden="true"><img class="brand-art" src="brand.png" alt="Aieyes"></span>
      <nav class="panel-tabs" aria-label="面板导航">
        <button type="button" data-page="agent" class="active">Agent</button>
        <button type="button" data-page="servers">服务器</button>
      </nav>
      <div class="panel-refresh-wrap">
        <button type="button" id="panel-refresh" aria-label="刷新" aria-haspopup="true" aria-expanded="false" title="刷新" data-ui-icon="refresh"></button>
        <div id="panel-menu" class="panel-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-refresh="scan">同步记录</button>
          <button type="button" role="menuitem" data-refresh="quotas">刷新限额</button>
          <button type="button" role="menuitem" data-refresh="prices">同步价格</button>
          <button type="button" role="menuitem" data-refresh="hosts">刷新服务器</button>
        </div>
      </div>
    </header>
    <div class="panel-body">
      <div id="message" role="status" hidden></div>
      <details id="live-sessions"><summary><span id="session-indicator" class="phase-mark session-phase" aria-hidden="true"></span><span id="session-summary">正在读取会话状态…</span><span class="muted" title="已启用的本机和 SSH Agent 会话状态">Codex / Claude / AGY</span></summary><div id="session-list"></div><p id="session-warning" class="error" hidden>部分日志不可读，状态可能不完整。</p></details>
      <section id="content"></section>
    </div>
    <footer class="panel-foot">
      <div class="panel-connection"><span id="activity" aria-live="polite">正在加载</span>
      </div><div class="panel-actions">
      <button type="button" data-theme-toggle aria-label="切换明暗模式" title="切换明暗模式"></button>
      <button type="button" id="panel-update" aria-label="检查更新" title="检查更新"><span data-ui-icon="download" aria-hidden="true"></span><span class="update-badge" hidden>!</span></button>
      <button type="button" id="panel-detail" aria-label="打开详情" title="打开详情（Ctrl+Shift+D）" data-ui-icon="expand"></button>
      <button type="button" id="panel-settings" aria-label="设置" title="设置（Ctrl+,）" data-ui-icon="settings"></button>
      <details id="panel-more" class="panel-more"><summary aria-label="更多操作" title="更多操作" data-ui-icon="more"></summary><div class="panel-more-menu"><p>关闭面板后继续后台监测。</p><button type="button" id="panel-accounts">面板显示账户…</button><button type="button" id="panel-latency">测试出站连接</button><button type="button" id="panel-pin" data-pinned="false" aria-pressed="false">固定面板</button><button type="button" id="panel-quit">退出 Aieyes</button></div></details>
      </div>
    </footer>
  </div>
  <script src="icons.js"></script><script src="scroll-affordance.js"></script><script src="webview-guards.js"></script><script src="tooltip.js"></script><script src="motion.js"></script><script src="single-select.js"></script>
  <script src="sessions.js"></script>
  <script src="refresh.js"></script><script src="multiselect.js"></script><script src="ui-state.js"></script><script src="pet-animation.js"></script><script src="analysis.js"></script><script src="server-renderer.js"></script><script src="account-targets.js"></script><script src="codex-api.js"></script>
<script src="view-state.js"></script><script src="app.js"></script><script src="automatic-estimates.js"></script><script src="agent-settings.js"></script>
  <script src="network.js"></script><script src="updates.js"></script><script src="pet.js"></script><script src="floating.js"></script>
</body>
</html>
