[package]
name = "aieyes-desktop"
version = "0.1.54"
edition = "2024"
default-run = "aieyes-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "1"

[dependencies]
png = "0.18"
aieyes-core = { path = "../../../crates/core" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-updater = "=2.13.1"
semver = "1"
tempfile = "3"
minisign-verify = "0.2.5"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
chrono = "0.4.45"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
pangocairo = "0.18"
x11rb = { version = "0.13", features = ["xinput"] }
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader"] }

[features]
native-tray = ["tauri/tray-icon"]
release-tools = []
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "verify-update"
path = "src/verify-update.rs"
required-features = ["release-tools"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
